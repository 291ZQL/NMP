name = "NMP"
compatibility_date = "2026-08-04"
compatibility_flags = ["nodejs_compat"]
main = ".open-next/worker.js"
minify = true

# 静态资源配置
# Cloudflare Workers Assets 用于服务静态文件
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# D1 数据库绑定
[[d1_databases]]
binding = "DB"
database_name = "nmplay"
database_id = "f2ceb7ac-cfc8-4a98-87f0-5ad1a91520e4"

[vars]
NODE_ENV = "production"
BUILD_TARGET = "cloudflare"
